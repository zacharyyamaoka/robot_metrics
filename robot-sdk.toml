# robot-sdk declaration: the shared types this package's public API takes (consumes) and gives (produces),
# each with the symbols that are the contract. Checked against the code by robot_sdk's
# `python -m tools.sdk_graph check` (docs/graph-schema.md in github.com/zacharyyamaoka/robot_sdk).
schema = "robot-sdk-declaration/1"
role = "library"
layer = "leaf"
one_line = "Tracking, stop, lag, repeatability metrics over message streams"
summary = "Performance metrics for robot parts: tracking error, stop error, lag, repeatability, with units. Works on a whole recording or a live feed, with identical numbers. Runs group into rungs, stations and deployments; pass/fail targets (objectives) are kept apart from the maths. Shaped like torchmetrics."
use_when = "Scoring any run: target vs real, sim vs real, before vs after, pass/fail gates."

# Where to read more. github and pypi are required; the rest are what this package has.
[links]
github = "https://github.com/zacharyyamaoka/robot_metrics"
pypi = "https://pypi.org/project/robot-metrics/"
site = "https://zacharyyamaoka.github.io/robot_metrics/"
changelog = "https://github.com/zacharyyamaoka/robot_metrics/blob/main/CHANGELOG.md"

[[consumes]]
type = "robot_msgs.trajectory.JointTrajectory"
symbols = [
  "robot_metrics.stops.stops",
  "robot_metrics.alignment.align",
  "robot_metrics.alignment.Aligner.push",
]

[[produces]]
type = "robot_msgs.trajectory.JointTrajectory"
symbols = [
  "robot_metrics.alignment.Aligned.target",
  "robot_metrics.alignment.Aligned.measured",
  "robot_metrics.stops.Stop.move",
]
